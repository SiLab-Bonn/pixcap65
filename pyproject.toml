# commented configuration options are the result when using hatch instead of setuptool
[project]
name = "pixcap65_DOMI1279"
dynamic = ["version"]
description = "Host software for the PixCap65 chip control system based on MIO2 + GPAC hardware."
authors = [
    { name = "Hans Krüger", email = "krueger@physik.uni-bonn.de" },
]
maintainers = [
    { name = "Yannick Dieter", email = "dieter@physik.uni-bonn.de" },
    { name = "Dominik Fischer", email = "s6dkfisc@uni-bonn.de" },
]
license = "MIT AND BSD-3-Clause"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=2.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy < 2; python_version < '3'",
    "numpy < 2.3; python_version > '3' and python_version < '3.11'",
    "numpy>=2.3; python_version >= '3.11'",
    "matplotlib",
    "tables>=3.0",
    "pyyaml",
    "bitarray<=1.9.0; python_version < '3'",
    "bitarray>=3.4.0; python_version >= '3.5'",
    "bitarray; python_version < '3.5' and python_version >= '3'",
    "coloredlogs",
    # these declaration is only for the package index!
    "basil-daq <= 3.2.0.dev0",
    # only to be used for the installs and not for defining the dependency for the package index!
    # "basil-daq @ git+https:////github.com/SiLab-Bonn/basil.git@502a999eb5075e04850f7a481d2668726583c290 ; python_version >= '3.9'",
    # "basil-daq==3.1.0; platform_system == 'Windows' or python_version < '3.9'",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/SiLab-Bonn/pixcap65/"
Issues = "https://github.com/SiLab-Bonn/pixcap65/issues/"
"Source code" = "https://github.com/SiLab-Bonn/pixcap65/"
# no documentation present.

[project.scripts]
pixcap_inter_cap = "pixcap65.pixcap_65_test_inter_cap"
pixcap_total_cap = "pixcap65.pixcap_65_test_total_cap"
pixcap_line = "pixcap65.pixcap.pixcap_65_test_load_line"

[project.optional-dependencies]
dut = [
    "pyserial",
    "pyvisa ; python_version > '3.5'",
    "pyusb",
    "pysilibusb"
]
advanced = [
    "iminuit>2.30.0; python_version >= '3.9'",
    "iminuit ; python_version < '3.9'",
    "kafe2>2.10.0; python_version >= '3.7'",
    "kafe2 ; python_version < '3.7'",
    "scipy>=1.15.0; python_version >= '3.10'",
    "scipy ; python_version < '3.10'",
    "jacobi ; python_version >= '3.6'",
    "findiff",
]
visualization = [
    "pyqt5",
    "vitables",
    "matplotlib",
]




# configuration of different build systems which could be used interchangebly!
[build-system]
requires = ["setuptools >= 77.0.3", "hatchling >= 1.26", "uv_build >= 0.11.7, <0.12.0"]
build-backend = "setuptools.build_meta"
# build-backend = "hatchling.build"
# build-backend = "uv_build"

# setuptools configuration
[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "pixcap65.pixcap.__version__" }

[tool.setuptools.exclude-package-data]
pixcap65 = [".gitattributes", ".gitignore", "**.h5"]

[tool.setuptools.packages.find]
include = ["pixcap65*"]
exclude = ["tests", "data_local", "Data", "doc", "**full_analysis", "**.h5", "**.pdf", "legacy"]

# hatch configuration
[tool.hatch.version]
path = "pixcap65/pixcap/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
directory = "out"

[tool.hatch.build.targets.wheel]
packages = ["pixcap65"]

[tool.hatch.build.targets.sdist]
exclude = [
    "*.h5",
    "*.pdf",
    "**/full_analysis.py"
]

[tool.hatch.envs.hatch-build]
installer = "pip"

[tool.uv.build-backend]
module-name = "pixcap65"
module-root = ""
namespace = true
data = ["pixcap65/device"]
source-exclude = ["doc", "Data", "data_local"]

