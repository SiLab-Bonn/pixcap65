comment: here display corresponds to the default measurement accuracy.
voltage:
  - range: 200
    unit: "mV"
    prefix: 1.0e-3
    resolution:
      display: 1e-3
      accuracy: 0.012
      amps: 0.3
      resistance: NaN
      temperature: 23

  - range: 2
    unit: "V"
    prefix: 1e0
    resolution:
      display: 1e-5
      accuracy: 0.012
      amps: 3e-4
      resistance: NaN
      temperature: 23

  - range: 20
    unit: "V"
    prefix: 1e0
    resolution:
      display: NaN
      accuracy: 0.015
      amps: 1e-4
      resistance: NaN
      temperature: 23

  - range: 200
    unit: "V"
    prefix: 1e0
    resolution:
      display: 1e-2
      accuracy: 0.015
      amps: 5e-2
      resistance: NaN
      temperature: 23

current:
  - range: 1
    unit: "µA"
    prefix: 1e-6
    resolution:
      display: 1e-5
      accuracy: 0.029
      amps: 3e-4
      temperature: 23
  - range: 10
    unit: "µA"
    prefix: 1e-6
    resolution:
      display: 1e-4
      accuracy: 0.027
      amps: 7e-4
      temperature: 23

  - range: 100
    unit: "µA"
    prefix: 1e-6
    resolution:
      display: 1e-3
      accuracy: 0.025
      amps: 6e-3
      temperature: 23

  - range: 1
    unit: "mA"
    prefix: 1e-3
    resolution:
      display: 1e-5
      accuracy: 0.027
      amps: 6e-5
      temperature: 23

  - range: 20
    unit: "mA"
    prefix: 1e-3
    resolution:
      display: 1e-4
      accuracy: 0.035
      amps: 1.2e-3
      temperature: 23

  - range: 100
    unit: "mA"
    prefix: 1e-3
    resolution:
      display: 1e-3
      accuracy: 0.055
      amps: 6e-3
      temperature: 23

  - range: 1
    unit: "A"
    prefix: 1e0
    resolution:
      display: 1e-5
      accuracy: 0.22
      amps: 5.7e-4
      temperature: 23


temperature:
  voltage:
    - upper: 1000
      lower: 20
      scaling: 0.15
      coefficient: 1.0
    - upper: 2
      lower: 0.2
      scaling: 0.30
      coefficient: 1.0

  current:
    - upper: 1000000
      lower: 0
      scaling: 0.15
      coefficient: 1.0