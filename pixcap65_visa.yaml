---
name    : pixcap65 
version : 0.01

transfer_layer:
  - name  : USB
    type  : SiUsb
    board_id : 201
    init  :
        bit_file : "device/ise/pixcap65.bit"
        avoid_download : True
#        avoid_download : False

  - name     : Serial
    type     : Serial
    init     :
        port     : "/dev/ttyUSB0"
        # for 2410 we need
        # read_termination : "\r"
        read_termination : "\n"
        baudrate : 19200
        # only necessary when 2602a is used as SMU
        parity   : "E"
        bytesize : 8
        rtscts   : True
        exclusive : False
# use this only as a serial driver
  - name: Visa
    type: Visa
    init:
      # not sure whether this would work at all.
      resource_name: ASRL/dev/ttyUSB0
      resource_name: ASRLCOM3
      read_termination: "\n"
      baud_rate: 19200
      parity: 2
      data_bits: 8
      flow_control: 2
      access_mode : 0
      backend: "@py"

  # use this as an ip driver
  - name: Visa
    type: Visa
    init:
      # VXI-11 communication
      resource_name: TCPIP::131.220.x.x::INSTR
      # Raw socket communication
      resource_name: TCPIP::131.220.x.x::5025::SOCKET
      read_termination: "\n"
      write_termination: "\n"
      chunk_size: 2097152
      backend: "@py"





hw_drivers:
  - name        : SMU
    type        : scpi
    interface   : Visa
    init        :
        device  : Keithley 2602a
    pixcap_init :
      channel   : 1

  - name        : SMU1
    type        : scpi
    interface   : Visa
    init        :
      device    : Keithley 2602a
    pixcap_init :
      channel   : 2

  - name      : GPAC
    type      : GPAC
    interface : USB
    base_addr : 0x00000

  - name      : MIO_PLL
    type      : MIO_PLL
    interface : USB
    base_addr : 0x00000
    pll_frequency : 40 

  - name      : gpio
    type      : gpio
    interface : USB
    base_addr : 0x10000
    size      : 8

  - name      : seq_gen
    type      : seq_gen
    interface : USB
    base_addr : 0x11000
#    mem_size  : 4096    
  
  - name      : spi
    type      : spi
    interface : USB
    base_addr : 0x14000
    
#  - name      : power
#    type      : tti_ql355tp
#    interface : SerialCOM12

registers:
  - name        : VDD
    type        : FunctionalRegister
    hw_driver   : GPAC
    arg_names   : [ value ]
    arg_add     : { 'channel': 'PWR0'}

  - name        : GPIO
    type        : StdRegister
    hw_driver   : gpio
    size        : 8
    fields:
      - name    : LED
        size    : 5
        offset  : 6
      - name    : RST_B
        size    : 1
        offset  : 0
          
  - name        : SEQ
    type        : TrackRegister
    hw_driver   : seq_gen
    seq_width   : 8
    seq_size    : 1024
    tracks  : 
      - name     : CLK_0
        position : 0  
      - name     : CLK_1
        position : 1
      - name     : CLK_2
        position : 2
      - name     : CLK_3
        position : 3
        
  - name        : SPI
    type        : StdRegister
    hw_driver   : spi
    size        : 9960  
    fields  :
      - name     : COL
        offset   : 9959
        size     : 249
        repeat   : 40
        fields   :
          - name     : PIX
            size     : 6
            offset   : 248
            repeat   : 41
            fields   :
              - name     : SEL
                size     : 2
                offset   : 5
              - name     : CLK_EN
                size     : 4
                offset   : 3
                
          - name     : EOC
            size     : 3
            offset   : 2         

  - name        : GPIO
    type        : StdRegister
    hw_driver   : gpio
    size        : 8
    fields:
      - name    : LED5
        size    : 1
        offset  : 5
      - name    : LED4
        size    : 1
        offset  : 4
      - name    : LED3
        size    : 1
        offset  : 3
      - name    : LED2
        size    : 1
        offset  : 2
      - name    : LED1
        size    : 1
        offset  : 1
      - name    : RST_B
        size    : 1
        offset  : 0              

  - name: SMU
    type: FunctionalRegister
    hw_driver: SMU
    arg_add: { 'channel': 1 }

  - name: BIAS_SUPPLY
    type: FunctionalRegister
    hw_driver: SMU
    arg_add: { 'channel': 2 }

  - name: SMU1
    type: FunctionalRegister
    hw_driver: SMU
    arg_add: { 'channel': -1 }

  - name: SMU2
    type: FunctionalRegister
    hw_driver: SMU
    arg_add: { 'channel': -1 }
