---
name    : pixcap65 
version : 0.01

transfer_layer:
  - name  : USB
    type  : SiUsb
    board_id : 201
    init  :
        bit_file : "device/ise/pixcap65.bit"
        avoid_download : True
#        avoid_download : False

  - name     : Visa
    type     : Visa
    identification: Keithley Instruments Inc., Model 2602A
    init     :
        port     : "ASRL/dev/ttyUSB0"
        # hwid: USB VID:PID=067B:2303 LOCATION=4-10
        # for primary SMU
        read_termination : "\n"
        baudrate : 19200
        # only necessary when 2602a is used as SMU
        parity   : 2
        data_bits : 8
        flow_control: 2
        access_mode: 0
        backend: "@py"

  - name: Visa2
    type: Visa
    identification: KEITHLEY INSTRUMENTS INC.,MODEL 2410
    init:
      port: "ASRL/dev/ttyUSB2"
      # hwid: USB VID:PID=0403:6001 LOCATION=4-9
      # for biasing smu
      read_termination: "\r"
      baudrate: 19200
      parity: 0
      data_bits: 8

  - name: Serial3
    type: Serial
    # identification: THURLBY-THANDAR,QL355TP,0,1.6
    init:
      port: "/dev/ttyUSB1"
      # for power supply
      read_termination: "\r\n"
      write_termination: "\n"
      baudrate: 19200
      timeout: 2.0
      xonxoff: True
      parity: N
      stopbits: 1
      bytesize: 8


hw_drivers:
  - name        : SMU_Device
    type        : scpi
    interface   : Serial
    init        :
        device  : Keithley 2602a
        enable_binary_commands: True

  - name        : BIAS_SMU
    type        : scpi
    interface   : Serial2
    init        :
      device    : Keithley 2410
      enable_formatting: False

  - name      : GPAC
    type      : GPAC
    interface : USB
    base_addr : 0x00000

  - name      : MIO_PLL
    type      : MIO_PLL
    interface : USB
    base_addr : 0x00000
    pll_frequency : 40 

  - name      : gpio
    type      : gpio
    interface : USB
    base_addr : 0x10000
    size      : 8

  - name      : seq_gen
    type      : seq_gen
    interface : USB
    base_addr : 0x11000
#    mem_size  : 4096    
  
  - name      : spi
    type      : spi
    interface : USB
    base_addr : 0x14000
    
  - name      : power
    type      : tti_ql355tp
    interface : Serial3

registers:
  - name        : VDD
    type        : FunctionalRegister
    hw_driver   : GPAC
    arg_names   : [ value ]
    arg_add     : { 'channel': 'PWR0'}

  - name        : GPIO
    type        : StdRegister
    hw_driver   : gpio
    size        : 8
    fields:
      - name    : LED
        size    : 5
        offset  : 6
      - name    : RST_B
        size    : 1
        offset  : 0
          
  - name        : SEQ
    type        : TrackRegister
    hw_driver   : seq_gen
    seq_width   : 8
    seq_size    : 1024
    tracks  : 
      - name     : CLK_0
        position : 0  
      - name     : CLK_1
        position : 1
      - name     : CLK_2
        position : 2
      - name     : CLK_3
        position : 3
        
  - name        : SPI
    type        : StdRegister
    hw_driver   : spi
    size        : 9960  
    fields  :
      - name     : COL
        offset   : 9959
        size     : 249
        repeat   : 40
        fields   :
          - name     : PIX
            size     : 6
            offset   : 248
            repeat   : 41
            fields   :
              - name     : SEL
                size     : 2
                offset   : 5
              - name     : CLK_EN
                size     : 4
                offset   : 3
                
          - name     : EOC
            size     : 3
            offset   : 2         

  - name        : GPIO
    type        : StdRegister
    hw_driver   : gpio
    size        : 8
    fields:
      - name    : LED5
        size    : 1
        offset  : 5
      - name    : LED4
        size    : 1
        offset  : 4
      - name    : LED3
        size    : 1
        offset  : 3
      - name    : LED2
        size    : 1
        offset  : 2
      - name    : LED1
        size    : 1
        offset  : 1
      - name    : RST_B
        size    : 1
        offset  : 0              

  - name: SMU
    type: FunctionalRegister
    hw_driver: SMU_Device
    arg_add: { 'channel': 1 }

  - name: BIAS_SUPPLY
    type: FunctionalRegister
    hw_driver: BIAS_SMU
    arg_add: { }

  - name: VM1
    type: FunctionalRegister
    hw_driver: SMU_Device
    arg_add: { 'channel': -1 }

  - name: VM2
    type: FunctionalRegister
    hw_driver: SMU_Device
    arg_add: { 'channel': -1 }

  - name: VM3
    type: FunctionalRegister
    hw_driver: SMU_Device
    arg_add: { 'channel': 1 }

  - name: SMU_SETUP
    type: FunctionalRegister
    hw_driver: SMU_Device
    arg_add: {}

